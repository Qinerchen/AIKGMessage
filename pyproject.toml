[project]
name = "news-digest"
version = "0.1.0"
description = "Personal RSS digest with LLM summarization, exposed as an MCP server for Claude"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "anthropic>=0.40",
    "mcp[cli]>=1.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "python-dotenv>=1.2.2",
]

[tool.uv]
